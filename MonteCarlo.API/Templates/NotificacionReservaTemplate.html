<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TITULO}}</title>
</head>
<body style="margin:0; padding:0; background-color:#102820; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#102820; padding:48px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="width:100%; max-width:480px;">

          <!-- Marca -->
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <div style="font-family:Georgia, 'Times New Roman', serif; font-size:28px; letter-spacing:0.02em; color:#ffffff;">
                Monte Carlo
              </div>
              <div style="font-size:14px; letter-spacing:0.14em; text-transform:uppercase; color:#d9a26a; margin-top:4px;">
                Bar restaurante
              </div>
            </td>
          </tr>

          <!-- Tarjeta -->
          <tr>
            <td style="background-color:#ffffff; border-radius:12px; box-shadow:0 8px 24px rgba(27,31,29,0.12);">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding:32px 32px 8px 32px;">
                    <h1 style="margin:0 0 8px 0; font-size:22px; font-weight:600; color:#1b1f1d;">
                      {{TITULO}}
                    </h1>
                  </td>
                </tr>
                <tr>
                  <td style="padding:0 32px 24px 32px;">
                    <p style="margin:0 0 16px 0; font-size:15px; line-height:1.6; color:#1b1f1d;">
                      Hola {{NOMBRE}},
                    </p>
                    <p style="margin:0 0 24px 0; font-size:15px; line-height:1.6; color:#1b1f1d;">
                      {{MENSAJE}}
                    </p>

                    <!-- Datos de la reserva -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #e2e0d9; border-radius:8px; margin-bottom:24px;">
                      <tr>
                        <td style="padding:12px 16px; font-size:13px; color:#5a615d; border-bottom:1px solid #e2e0d9;">C&oacute;digo de reserva</td>
                        <td style="padding:12px 16px; font-size:15px; font-weight:600; color:#1b1f1d; border-bottom:1px solid #e2e0d9;" align="right">{{CODIGO}}</td>
                      </tr>
                      <tr>
                        <td style="padding:12px 16px; font-size:13px; color:#5a615d; border-bottom:1px solid #e2e0d9;">Fecha</td>
                        <td style="padding:12px 16px; font-size:15px; color:#1b1f1d; border-bottom:1px solid #e2e0d9;" align="right">{{FECHA}}</td>
                      </tr>
                      <tr>
                        <td style="padding:12px 16px; font-size:13px; color:#5a615d; border-bottom:1px solid #e2e0d9;">Hora</td>
                        <td style="padding:12px 16px; font-size:15px; color:#1b1f1d; border-bottom:1px solid #e2e0d9;" align="right">{{HORA}}</td>
                      </tr>
                      <tr>
                        <td style="padding:12px 16px; font-size:13px; color:#5a615d;">Personas</td>
                        <td style="padding:12px 16px; font-size:15px; color:#1b1f1d;" align="right">{{PERSONAS}}</td>
                      </tr>
                    </table>

                    <table role="presentation" cellpadding="0" cellspacing="0">
                      <tr>
                        <td style="background-color:#1f4d3d; border-radius:8px;">
                          <a href="{{ENLACE}}"
                             style="display:inline-block; padding:12px 28px; font-size:15px; font-weight:600; color:#ffffff; text-decoration:none;">
                            {{TEXTO_ENLACE}}
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Pie de pagina -->
          <tr>
            <td align="center" style="padding-top:24px;">
              <p style="margin:0; font-size:13px; color:rgba(255,255,255,0.75);">
                Este es un mensaje autom&aacute;tico, por favor no respondas a este correo.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
